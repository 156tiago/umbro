<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbro · Performance e Lifestyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Outfit:wght@800&family=Archivo:wdth,wght@125,800;125,900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#181818;color:#cfcfcf;font-family:Barlow,system-ui,sans-serif;min-height:100vh}
  button{font:inherit}
  a{color:inherit;text-decoration:none}

  /* ---------- Barra da apresentação ---------- */
  .pres{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 24px}
  .pres h1{font:800 20px/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:#fff}
  .pres h1 span{color:#8a8a8a;font-weight:600}
  .views{display:flex;border:1.5px solid #fff}
  .views button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 18px;font:700 15px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;color:#fff}
  .views button.on{background:#fff;color:#111}
  .views svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
  .views button:focus-visible{outline:3px solid #2f6bff;outline-offset:2px}
  .stage{padding:0 24px 48px;display:flex;justify-content:center}
  [hidden]{display:none !important}

  /* ---------- Tema por linha (vale para as duas versões) ---------- */
  .site{--ink:#111;--paper:#fff;--line:#e6e6e6;--muted:#555;background:var(--paper);color:var(--ink)}
  .site[data-line="lifestyle"]{--ink:#fff;--paper:#000;--line:#2a2a2a;--muted:#b0b0b0}
  .disp{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
  .site[data-line="lifestyle"] .disp{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;letter-spacing:.01em}

  /* Logo oficial */
  .logo{display:flex;align-items:center;color:var(--ink)}
  .logo .mk{width:auto;display:none}
  .site[data-line="performance"] .logo .perf,
  .site[data-line="lifestyle"] .logo .life{display:block}
  .ico{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* Seletor de linha */
  .seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}
  .seg button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .seg button:focus-visible{outline:3px solid #2f6bff;outline-offset:-3px}
  .seg .dm{width:auto;flex:none}
  .seg [data-set="performance"] span{font:800 1em/1 Outfit,sans-serif;letter-spacing:-.02em;text-transform:lowercase}
  .seg [data-set="lifestyle"] span{font:900 .75em/1 Archivo,sans-serif;font-stretch:125%;letter-spacing:.02em;text-transform:uppercase}

  /* Banner de coleção (foto + nome) */
  .banner{position:relative;display:flex;align-items:flex-end;overflow:hidden;color:#fff;background:#222}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  .banner:hover img{transform:scale(1.03)}
  .banner::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .banner b{position:relative;z-index:1}

  /* =========================================================
     VERSÃO COMPUTADOR
     ========================================================= */
  .browser{width:100%;max-width:1360px;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .chrome{background:#2b2b2b;display:flex;align-items:center;gap:14px;padding:10px 14px}
  .dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#555}
  .url{flex:1;max-width:520px;margin:0 auto;background:#1c1c1c;border-radius:6px;padding:6px 12px;font-size:13px;color:#aaa;text-align:center}
  .desk{position:relative}
  .d-top{background:#000;color:#fff;font:600 12px/1 Barlow;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:9px}
  .site[data-line="lifestyle"] .d-top{background:#fff;color:#000}
  .d-head{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px;padding:0 40px;height:84px;border-bottom:1px solid var(--line);background:var(--paper)}
  .d-head .logo .mk{height:52px}
  .d-nav{display:flex;justify-content:center;height:100%}
  .d-nav > div{height:100%;display:flex;align-items:center}
  .d-nav > div > a{display:flex;align-items:center;height:100%;padding:0 18px;font-size:19px;border-bottom:3px solid transparent}
  .site[data-line="lifestyle"] .d-nav > div > a{font-size:14px}
  .d-nav > div:hover > a,.d-nav > div:focus-within > a{border-bottom-color:var(--ink)}
  .d-right{display:flex;align-items:center;gap:22px}
  .d-right .seg{width:300px;height:42px;font-size:17px}
  .d-right .seg .dm{height:12px}
  .d-right .icons{display:flex;gap:18px}

  .mega{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 24px 40px rgba(0,0,0,.12);display:none;padding:32px 40px 40px;grid-template-columns:repeat(4,minmax(0,1fr)) 1.3fr;gap:32px}
  .d-nav > div:hover .mega,.d-nav > div:focus-within .mega{display:grid}
  .mega h4{font-size:18px;padding-bottom:10px;margin-bottom:8px;border-bottom:2px solid var(--ink)}
  .site[data-line="lifestyle"] .mega h4{font-size:13px}
  .mega .gl{font:600 11px/1 Barlow;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .mega a{display:block;padding:5px 0;font-size:15px;color:var(--ink)}
  .mega a:hover{text-decoration:underline;text-underline-offset:3px}
  .mega .banner{grid-column:5;aspect-ratio:4/3;padding:16px}
  .mega .banner b{font-size:24px}
  .site[data-line="lifestyle"] .mega .banner b{font-size:15px}

  .d-hero{height:560px;padding:40px}
  .d-hero b{font-size:84px;line-height:.9}
  .site[data-line="lifestyle"] .d-hero b{font-size:52px}
  .d-hero .cta{position:absolute;right:40px;bottom:44px;z-index:1;border:2px solid #fff;padding:14px 26px;font:700 14px/1 Barlow;letter-spacing:.14em;text-transform:uppercase}
  .d-grid{display:grid}
  .d-grid .banner{aspect-ratio:4/5;padding:24px}
  .d-grid .banner b{font-size:30px;line-height:.95}
  .site[data-line="lifestyle"] .d-grid .banner b{font-size:17px;line-height:1.1}
  .d-sec{padding:56px 40px}
  .d-sec h2{font-size:40px;margin-bottom:22px}
  .site[data-line="lifestyle"] .d-sec h2{font-size:26px}
  .d-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .d-cats a{border:2px solid var(--ink);padding:22px 18px;display:flex;flex-direction:column;gap:8px}
  .d-cats a small{font:600 11px/1 Barlow;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .d-cats a b{font-size:24px}
  .site[data-line="lifestyle"] .d-cats a b{font-size:15px}
  .d-cats a:hover{background:var(--ink);color:var(--paper)}
  .d-cats a:hover small{color:var(--paper)}
  .d-foot{padding:28px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .d-foot .logo .mk{height:36px}

  /* =========================================================
     VERSÃO CELULAR
     ========================================================= */
  .phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 110px));min-height:640px;border:10px solid #000;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
  .m-status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font:600 13px/1 Barlow;color:var(--ink);background:var(--paper)}
  .m-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 20px 14px;background:var(--paper)}
  .m-top .grp{display:flex;gap:20px;align-items:center}
  .m-top .grp:last-child{justify-content:flex-end}
  .m-top .logo .mk{height:44px}
  .m-top button{all:unset;cursor:pointer;display:flex}
  .phone .seg{margin:0 20px;height:50px;font-size:18px;flex:none}
  .phone .seg .dm{height:13px}
  .m-scroll{flex:1;overflow-y:auto;margin-top:16px}
  .m-scroll::-webkit-scrollbar,.panel::-webkit-scrollbar{display:none}
  .m-grid{display:grid;grid-template-columns:1fr 1fr}
  .m-grid .banner{aspect-ratio:1;padding:14px}
  .m-grid .banner.wide{grid-column:1/-1;aspect-ratio:4/5}
  .m-grid .banner b{font-size:21px;line-height:.95}
  .m-grid .banner.wide b{font-size:34px}
  .site[data-line="lifestyle"] .m-grid .banner b{font-size:13px;line-height:1.1}
  .site[data-line="lifestyle"] .m-grid .banner.wide b{font-size:20px}
  .m-cats{padding:28px 20px}
  .m-cats h2{font-size:24px;margin-bottom:12px}
  .site[data-line="lifestyle"] .m-cats h2{font-size:16px}

  /* Menu (gaveta) */
  .drawer{position:absolute;inset:0;z-index:5;background:var(--paper);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .35s cubic-bezier(.6,0,.2,1)}
  .drawer.open{transform:none}
  .viewport{position:relative;flex:1;overflow:hidden;margin-top:6px}
  .panel{position:absolute;inset:0;overflow-y:auto;padding:16px 20px 28px;background:var(--paper);transition:transform .35s cubic-bezier(.6,0,.2,1)}
  .panel.sub{transform:translateX(100%)}
  .panel.sub.open{transform:none}
  .panel.root.pushed{transform:translateX(-30%)}
  .kicker{font-size:13px;color:var(--muted);margin-bottom:12px}
  .panel h3{font-size:26px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .panel h3 + ul{margin-bottom:30px}
  ul{list-style:none}
  .row{appearance:none;background:none;border:0;text-align:left;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:21px;font-weight:700;color:var(--ink)}
  .row .ico{width:20px;height:20px;stroke-width:2.2}
  .row.leaf{font-weight:600;font-size:19px}
  .site[data-line="lifestyle"] .panel h3{font-size:19px;padding-bottom:14px}
  .site[data-line="lifestyle"] .row{font-size:14px;padding:18px 0}
  .site[data-line="lifestyle"] .row.leaf{font-size:12.5px;font-weight:800}
  .group-label{font:600 12px/1 Barlow;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px}
  .back{all:unset;cursor:pointer;display:flex;gap:6px;align-items:center;font:600 13px/1 Barlow;color:var(--muted);margin-bottom:14px}
  .back .ico{width:16px;height:16px;stroke:var(--muted)}
  .seeall{display:block;margin-top:18px;font-size:15px;text-decoration:underline;text-underline-offset:4px}
  .site[data-line="lifestyle"] .seeall{font-size:12px}

  @media (max-width:1100px){
    .d-head{grid-template-columns:auto 1fr;padding:0 24px}
    .d-nav{display:none}
    .d-hero b{font-size:56px}
  }
</style>
</head>
<body>

<div class="pres">
  <h1>Umbro <span>· Performance e Lifestyle</span></h1>
  <div class="views" role="tablist" aria-label="Visualização">
    <button class="on" data-view="desk" role="tab"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>Computador</button>
    <button data-view="mob" role="tab"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Celular</button>
  </div>
</div>

<div class="stage">
  <!-- Computador -->
  <div class="browser" id="v-desk">
    <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">umbro.com.br</div></div>
    <div class="site desk" id="desk"></div>
  </div>
  <!-- Celular -->
  <div class="phone site" id="v-mob" hidden></div>
</div>

<script>
const I = {
  x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  menu:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  heart:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  search:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>',
  bag:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
  chev:'<svg class="ico" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
  back:'<svg class="ico" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>'
};

// fotos das campanhas no CDN do umbro.com
const IMG = (path, w, h) => `https://cdn-umbroglobal-media.azureedge.net/${path}?anchor=center&mode=crop&width=${w}&height=${h}&format=webp`;
const ACESSORIOS_ESPORTE = ['Bolas','Caneleiras','Luvas de goleiro','Meias e meiões','Bolsas e mochilas','Apito e cartões','Joelheira e cotoveleira'];

/* Estrutura proposta, com nomes do menu atual do umbro.com.br */
const DATA = {
  performance:{
    kicker:'Linha de futebol', top:'Frete grátis e Pix · Linha de futebol',
    sections:[
      {title:'Calçados', items:[

let line = 'performance';
const LOGOS = document.getElementById('logos').innerHTML;
const logoHTML = () => `<a href="#" class="logo" aria-label="Umbro">${LOGOS}</a>`;
const segHTML = () => `<div class="seg" role="tablist" aria-label="Linha">
  <button data-set="performance" role="tab"><span>performance</span></button>
  <button data-set="lifestyle" role="tab"><span>Lifestyle</span></button></div>`;
const banner = (b, w, h, cls='') => `<a class="banner ${cls}" href="#"><img src="${IMG(b.img,w,h)}" alt=""><b class="disp">${b.t}</b></a>`;

/* losango de cada logo oficial dentro do botão da sua linha */
function addDiamonds(root){
  root.querySelectorAll('.seg').forEach(seg => {
    [['performance','.perf','0 0 511.39 227.1'],['lifestyle','.life','0 0 543.32 238']].forEach(([k,sel,vb]) => {
      const b = seg.querySelector(`[data-set="${k}"]`);
      if (b.querySelector('.dm')) return;
      const dm = root.querySelector('.logo '+sel).cloneNode(true);
      dm.setAttribute('class','dm'); dm.setAttribute('viewBox',vb);
      dm.removeAttribute('role'); dm.removeAttribute('aria-label'); dm.setAttribute('aria-hidden','true');
      b.prepend(dm);
    });
  });
}

/* ---------- Computador ---------- */
function navItems(){
  const d = DATA[line];
  // Performance: Calçados / Vestuário → colunas por público
  // Lifestyle: Masculino / Feminino / Acessórios / Collabs → colunas por grupo
  if (line === 'performance') return d.sections.map(s => ({name:s.title, cols:s.items.map(it => ({h:it.name, groups:it.groups}))}));
  return d.sections[0].items.map(it => ({name:it.name, cols:it.groups.map(g => ({h:g.label, groups:[{items:g.items}]}))}));
}
function renderDesk(){
  const d = DATA[line], el = document.getElementById('desk');
  const [hero, ...rest] = d.banners;
  const nav = navItems().map((n,i) => `<div><a href="#" class="disp">${n.name}</a>
    <div class="mega">${n.cols.map(c => `<div><h4 class="disp">${c.h}</h4>${c.groups.map(g => (g.label && c.groups.length>1 ? `<p class="gl">${g.label}</p>`:'') + g.items.map(x => `<a href="#">${x}</a>`).join('')).join('')}</div>`).join('')}
    ${banner(d.banners[i % d.banners.length], 640, 480)}</div></div>`).join('');
  const cats = line === 'performance'
    ? d.sections.flatMap(s => s.items.map(it => `<a href="#"><small>${s.title}</small><b class="disp">${it.name}</b></a>`)).join('')
    : d.sections[0].items.map((it,i) => `<a href="#"><small>0${i+1}</small><b class="disp">${it.name}</b></a>`).join('');
  el.innerHTML = `
    <div class="d-top">${d.top}</div>
    <header class="d-head">${logoHTML()}<nav class="d-nav">${nav}</nav>
      <div class="d-right">${segHTML()}<div class="icons">${I.search}${I.heart}${I.bag}</div></div></header>
    <a class="banner d-hero" href="#"><img src="${IMG(hero.img,1800,700)}" alt=""><b class="disp">${hero.t}</b><span class="cta">Ver coleção</span></a>
    <div class="d-grid" style="grid-template-columns:repeat(${rest.length},1fr)">${rest.map(b => banner(b, 700, 875)).join('')}</div>
    <section class="d-sec"><h2 class="disp">${line==='performance'?'Compre por categoria':'Navegue'}</h2><div class="d-cats">${cats}</div></section>
    <footer class="d-foot">${logoHTML()}<span>Mockup de proposta · arquitetura de marca Performance / Lifestyle</span></footer>`;
  addDiamonds(el);
}

/* ---------- Celular ---------- */
function rootHTML(){
  const d = DATA[line];
  let h = `<p class="kicker">${d.kicker}</p>`;
  d.sections.forEach((s,si) => {
    h += `<h3 class="disp">${s.title}</h3><ul>`;
    s.items.forEach((it,ii) => h += `<li><button class="row disp" data-s="${si}" data-i="${ii}">${it.name}${I.chev}</button></li>`);
    h += `</ul>`;
  });
  return h;
}
function subHTML(si, ii){
  const sec = DATA[line].sections[si], it = sec.items[ii];
  let h = `<button class="back">${I.back}${sec.title}</button><h3 class="disp">${it.name}</h3>`;
  it.groups.forEach(g => {
    h += `<p class="group-label">${g.label}</p><ul>` + g.items.map(x => `<li><a class="row leaf disp" href="#">${x}${I.chev}</a></li>`).join('') + `</ul>`;
  });
  return h + `<a class="seeall disp" href="#">Ver tudo em ${it.name}</a>`;
}
function renderMob(keepOpen){
  const d = DATA[line], el = document.getElementById('v-mob');
  const [hero, ...rest] = d.banners;
  el.innerHTML = `
    <div class="m-status"><span>9:41</span><span>●●● ▮</span></div>
    <div class="m-top"><div class="grp"><button class="open" aria-label="Abrir menu">${I.menu}</button></div>${logoHTML()}<div class="grp">${I.search}${I.bag}</div></div>
    ${segHTML()}
    <div class="m-scroll">
      <div class="m-grid">${banner(hero,800,1000,'wide')}${rest.map(b => banner(b,500,500)).join('')}</div>
      <div class="m-cats"><h2 class="disp">${line==='performance'?'Linha de futebol':'Linha streetwear'}</h2><p class="kicker">Toque em ☰ para ver o menu completo.</p></div>
    </div>
    <div class="drawer${keepOpen?' open':''}">
      <div class="m-status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="m-top"><div class="grp"><button class="close" aria-label="Fechar menu">${I.x}</button>${I.heart}</div>${logoHTML()}<div class="grp">${I.search}${I.bag}</div></div>
      ${segHTML()}
      <div class="viewport"><div class="panel root">${rootHTML()}</div><div class="panel sub"></div></div>
    </div>`;
  addDiamonds(el);
}

/* ---------- Estado e eventos ---------- */
function setLine(l){
  line = l;
  document.querySelectorAll('.site').forEach(s => s.dataset.line = l);
  const drawerOpen = !!document.querySelector('#v-mob .drawer.open');
  renderDesk(); renderMob(drawerOpen);
  document.querySelectorAll('.seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.set === l);
    b.setAttribute('aria-selected', b.dataset.set === l);
  });
}

document.addEventListener('click', e => {
  const seg = e.target.closest('.seg button');
  if (seg){ setLine(seg.dataset.set); return; }
  const v = e.target.closest('.views button');
  if (v){
    document.querySelectorAll('.views button').forEach(b => { b.classList.toggle('on', b === v); b.setAttribute('aria-selected', b === v); });
    document.getElementById('v-desk').hidden = v.dataset.view !== 'desk';
    document.getElementById('v-mob').hidden = v.dataset.view !== 'mob';
    return;
  }
  const mob = document.getElementById('v-mob');
  if (e.target.closest('#v-mob .open')) mob.querySelector('.drawer').classList.add('open');
  if (e.target.closest('#v-mob .close')){ mob.querySelector('.drawer').classList.remove('open'); }
  const row = e.target.closest('#v-mob .root .row');
  if (row){
    const sub = mob.querySelector('.sub');
    sub.innerHTML = subHTML(+row.dataset.s, +row.dataset.i); sub.scrollTop = 0;
    sub.classList.add('open'); mob.querySelector('.root').classList.add('pushed');
  }
  if (e.target.closest('#v-mob .back')){
    mob.querySelector('.sub').classList.remove('open'); mob.querySelector('.root').classList.remove('pushed');
  }
  if (e.target.closest('a')) e.preventDefault();
});

setLine('performance');
</script>
</body>
